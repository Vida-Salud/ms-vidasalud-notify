server:
  port: 8092

spring:
  application:
    name: ms-vidasalud-notify
  rabbitmq:
    # Nodos del clúster RabbitMQ (host:puerto separados por coma). Si un nodo cae,
    # el cliente se reconecta al siguiente de la lista.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASS:admin123}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # Si el servidor SMTP no responde, falla en 3 s y no bloquea el consumidor.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

notify:
  reintentos:
    max-intentos: 3
    intervalo-inicial-ms: 1000
    multiplicador: 2.0
  idempotencia:
    max-registros: 10000
  simulacion:
    habilitada: ${NOTIFY_SIMULACION:true}
  email:
    remitente: ${MAIL_FROM:notificaciones@vidasalud.cl}
    dominio-destinatario: vidasalud.cl
